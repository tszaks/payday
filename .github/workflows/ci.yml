name: CI

on:
  pull_request:
  push:
    branches:
      - production

concurrency:
  # Pull requests key on the ref, so a new push supersedes the run it replaced.
  # Pushes key on the SHA, because for a push to production the ref is a
  # CONSTANT -- every merge lands on refs/heads/production -- so a ref-keyed
  # group put consecutive merge commits in the same slot and cancel-in-progress
  # killed the earlier one. That is how 8260f7d (merge of #28) and 852f36a
  # (merge of the PR 4 follow-up) shipped to production with no CI verdict at
  # all: each was cancelled by the next merge, 105s and 8s later respectively.
  #
  # The merge commit is the artifact that actually ships, and it is the only
  # place a semantic conflict between two independently-green PRs can surface.
  # Verifying the PR head and skipping the merge commit checks the wrong object.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  core-tests:
    name: PaydayCore (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test --package-path Packages/PaydayCore
        run: swift test --package-path Packages/PaydayCore

  ios-tests:
    name: Payday app + widget (xcodebuild test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Provide a secret-free Debug xcconfig
        # Secrets.local.xcconfig is gitignored (it holds a local-only OpenAI key
        # for Insights narration), so xcodegen cannot find the Debug config file
        # on a clean checkout. CI resolves OPENAI_API_KEY to empty, exactly like
        # Secrets.release.xcconfig does for archives, so InsightsService.isConfigured
        # is false and the suite exercises the deterministic fallback path.
        run: |
          printf '// Generated on CI. Secret-free; mirrors Secrets.release.xcconfig.\nOPENAI_API_KEY =\n' > Secrets.local.xcconfig
      - name: Toolchain diagnostics
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          cat > /tmp/pick_sim.py <<'PYEOF'
          import json
          import sys

          data = json.load(sys.stdin)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      sys.exit(0)
          PYEOF
          UDID=$(xcrun simctl list devices available -j | python3 /tmp/pick_sim.py)
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: xcodebuild test
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          # The wall-clock budgets in RenderFactsPerformanceTests scale 4x on CI,
          # and that scaling was DEAD CODE until it was measured: these tests run
          # in the host app on the simulator, which does not inherit the runner's
          # environment, so the CI=true that GitHub sets here never reached them.
          # xcodebuild forwards a shell variable named TEST_RUNNER_<VAR> into the
          # test process as <VAR>. Measured: plain CI=true gives scale 1.0, this
          # gives 4.0. See the comment on budgetScale for the full three-way
          # measurement -- do not "simplify" this to CI.
          TEST_RUNNER_CI: "true"
        run: |
          xcodebuild test \
            -scheme Payday \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath /tmp/payday-dd \
            CODE_SIGNING_ALLOWED=NO

  edge-tests:
    name: payday-api (deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno test
        working-directory: supabase/functions/payday-api
        run: deno test

  design-lint:
    name: Design lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/design-lint.sh
        run: bash scripts/design-lint.sh

  db-migrations:
    name: Supabase migrations (db reset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, never `latest`. Two measured reasons. Resolving `latest`
          # calls the GitHub releases API on every run, and that rate limit is
          # the entire content of the only red production run we have:
          # c800493 (merge of PR 5 wave 1) failed with "Failed to resolve
          # latest Supabase CLI release: rate limit exceeded" while its other
          # four jobs were green. Second, a floating CLI means `db reset` can
          # change behaviour with no change in this repo, which is the exact
          # opposite of what a migration verifier is for. Bump deliberately.
          version: 2.117.0
      - name: supabase start
        run: supabase start
      - name: Apply every migration from scratch
        run: supabase db reset --local
      - name: SQL schema tests
        # Plain psql scripts, not pgTAP: every assertion lands in a temporary
        # results table and the script raises at the end if any failed, so
        # ON_ERROR_STOP makes a failure a non-zero exit. The connection string
        # is the local stack's fixed one (supabase/config.toml [db] port 54322).
        run: |
          for f in supabase/tests/*_test.sql; do
            echo "== $f"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: SQL concurrency tests
        # Six facts need two or three CONCURRENT sessions, which a psql script
        # cannot produce: the two lock variants, the try-lock loser's
        # non-blocking-ness, the concurrent duplicate backlog insert, the 40P01
        # row of the S-gate, and the one-shot meeting the trigger in both
        # orders. This drives real psql processes against the same local stack.
        run: bash scripts/db-test-race.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: supabase stop
        run: supabase stop
