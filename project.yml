name: Payday
options:
  bundleIdPrefix: com.szakacsmedia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.local.xcconfig
  Release: Secrets.release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 3D2B7RVUXV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_PREVIEWS: YES

targets:
  Payday:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Payday
        excludes:
          - "AppIcon.icon"
      - path: Payday/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_NAME: Payday
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "71627"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Payday
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Payday/Payday.entitlements
    info:
      path: Generated/Payday-Info.plist
      properties:
        OPENAI_API_KEY: "$(OPENAI_API_KEY)"
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - remote-notification
        NSFaceIDUsageDescription: Payday can lock itself with Face ID when you turn that on in Settings.
        NSCalendarsFullAccessUsageDescription: Payday reads only the calendar you choose, to time the end-of-shift reminder. Your schedule never leaves your phone.
        NSCameraUsageDescription: Payday uses the camera to read pay stubs and shift receipts and fill out your entries.
        # Lock Screen / StandBy accessory widgets can't host an interactive
        # button (see PaydayWidgetAccessoryViews.swift) — widgetURL + this
        # URL scheme is the only way one of those taps can reach the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.szakacsmedia.payday
            CFBundleURLSchemes:
              - payday
        # Required for the shift session's lock screen / Dynamic Island
        # Live Activity (see ShiftLiveActivity.swift).
        NSSupportsLiveActivities: true
        # Siri hears "Payday" as two words ("pay day") as often as one, and
        # an App Shortcut phrase only matches when the app name inside it
        # is recognized — so a misheard name means "I don't know that app"
        # rather than a wrong action. These register the variants and the
        # spoken pronunciation.
        INAlternativeAppNames:
          - INAlternativeAppName: Pay Day
            INAlternativeAppNamePronunciationHint: pay day
          - INAlternativeAppName: Payday App
            INAlternativeAppNamePronunciationHint: payday app
          - INAlternativeAppName: Pay Day App
            INAlternativeAppNamePronunciationHint: pay day app
        # Home Screen long-press quick actions — handled in AppDelegate.swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.szakacsmedia.payday.quickaction.log
            UIApplicationShortcutItemTitle: Log Shift
            UIApplicationShortcutItemIconSymbolName: plus.circle
          - UIApplicationShortcutItemType: com.szakacsmedia.payday.quickaction.startshift
            UIApplicationShortcutItemTitle: Start Shift
            UIApplicationShortcutItemIconSymbolName: timer
    dependencies:
      - target: PaydayWidget
        embed: true

  PaydayWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PaydayWidget
      - path: Payday/Models/TipEntry.swift
      - path: Payday/Models/PaycheckRecord.swift
      - path: Payday/Models/PayScheduleStore.swift
      - path: Payday/Utilities/PayPeriod.swift
      - path: Payday/Utilities/Money.swift
      - path: Payday/Utilities/TipBreakdown.swift
      - path: Payday/Utilities/StatsEngine.swift
      # StatsEngine's Move copy spells its counts through this — the widget
      # compiles StatsEngine, so it needs it too or the build fails with
      # "cannot find 'NumberWords' in scope".
      - path: Payday/Utilities/NumberWords.swift
      - path: Payday/Utilities/WageEstimate.swift
      - path: Payday/Utilities/ShiftDays.swift
      - path: Payday/Utilities/ShiftDetails.swift
      - path: Payday/Utilities/PeriodIncome.swift
      - path: Payday/Utilities/AppGroup.swift
      - path: Payday/Utilities/SharedModelContainer.swift
      - path: Payday/Utilities/DeepLinkCoordinator.swift
      - path: Payday/Design/DesignSystem.swift
      - path: Payday/Views/Shared/TipEntrySheetTarget.swift
      - path: Payday/Intents/OpenLogSheetIntent.swift
      - path: Payday/Utilities/ShiftSessionStore.swift
      - path: Payday/Utilities/ShiftSessionManager.swift
      - path: Payday/Intents/ShiftIntents.swift
    settings:
      base:
        PRODUCT_NAME: PaydayWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "71627"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Payday
        CODE_SIGN_ENTITLEMENTS: PaydayWidget/PaydayWidget.entitlements
        # The widget reads the same App-Group-shared store the app keeps in
        # sync with CloudKit — it must NOT also try to stand up its own
        # CloudKit sync engine in the extension process. SharedModelContainer
        # branches on this flag to pass cloudKitDatabase: .none there.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
    info:
      path: Generated/PaydayWidget-Info.plist
      properties:
        CFBundleDisplayName: Payday
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PaydayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PaydayTests
    dependencies:
      - target: Payday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Payday:
    build:
      targets:
        Payday: all
        PaydayWidget: all
        PaydayTests: [test]
    test:
      config: Debug
      targets:
        - PaydayTests
    run:
      config: Debug
