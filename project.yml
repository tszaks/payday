name: Payday
options:
  bundleIdPrefix: com.szakacsmedia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.local.xcconfig
  Release: Secrets.release.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 3D2B7RVUXV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_PREVIEWS: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.1
  PaydayCore:
    path: Packages/PaydayCore
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.29.0

targets:
  Payday:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Payday
        excludes:
          - "AppIcon.icon"
      - path: Payday/AppIcon.icon
        type: file
    settings:
      base:
        PRODUCT_NAME: Payday
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "9142029"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Payday
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: Payday/Payday.entitlements
        SUPABASE_URL: https://bkkxunqqfkogxibyyjmc.supabase.co
        SUPABASE_PUBLISHABLE_KEY: sb_publishable_LLozFUScbNbnXuGXVwSLSQ_Brbpy1RD
      # RELEASE ONLY, deliberately. A Sentry DSN is a WRITE-ONLY ingest key
      # designed to be embedded in a shipped client, so committing it is normal
      # practice and it belongs here next to the publishable key rather than in
      # the gitignored Secrets.local.xcconfig where the real OpenAI secret
      # lives. Those are different kinds of thing.
      #
      # It is scoped to Release rather than base so that Debug builds, unit
      # tests and CI have NO DSN and are therefore completely inert -- no SDK,
      # no network, no disk -- which is what PaydayCrashReporting.start()
      # already keys off. Putting it in base would send every crash from every
      # local debug run into the same project and bury the production signal
      # this exists to read. See docs/SENTRY.md.
      configs:
        Release:
          SENTRY_DSN: https://79f515cb21d214011bf6ae135fd38be1@o4510716101459968.ingest.us.sentry.io/4512107414028288
    info:
      path: Generated/Payday-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        OPENAI_API_KEY: "$(OPENAI_API_KEY)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_PUBLISHABLE_KEY: "$(SUPABASE_PUBLISHABLE_KEY)"
        SENTRY_DSN: "$(SENTRY_DSN)"
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Payday can lock itself with Face ID when you turn that on in Settings.
        NSCameraUsageDescription: Payday uses the camera to read pay stubs and shift receipts and fill out your entries.
        # Lock Screen / StandBy accessory widgets can't host an interactive
        # button (see PaydayWidgetAccessoryViews.swift) — widgetURL + this
        # URL scheme is the only way one of those taps can reach the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.szakacsmedia.payday
            CFBundleURLSchemes:
              - payday
        # Required for the shift session's lock screen / Dynamic Island
        # Live Activity (see ShiftLiveActivity.swift).
        NSSupportsLiveActivities: true
        # Siri hears "Payday" as two words ("pay day") as often as one, and
        # an App Shortcut phrase only matches when the app name inside it
        # is recognized — so a misheard name means "I don't know that app"
        # rather than a wrong action. These register the variants and the
        # spoken pronunciation.
        INAlternativeAppNames:
          - INAlternativeAppName: Pay Day
            INAlternativeAppNamePronunciationHint: pay day
          - INAlternativeAppName: Payday App
            INAlternativeAppNamePronunciationHint: payday app
          - INAlternativeAppName: Pay Day App
            INAlternativeAppNamePronunciationHint: pay day app
        # Home Screen long-press quick actions — handled in AppDelegate.swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.szakacsmedia.payday.quickaction.log
            UIApplicationShortcutItemTitle: Log Shift
            UIApplicationShortcutItemIconSymbolName: plus.circle
          - UIApplicationShortcutItemType: com.szakacsmedia.payday.quickaction.startshift
            UIApplicationShortcutItemTitle: Start Shift
            UIApplicationShortcutItemIconSymbolName: timer
    dependencies:
      - target: PaydayWidget
        embed: true
      - package: Supabase
      - package: PaydayCore
      # App target only, deliberately. The widget and the intents extension
      # crash in their own processes and would each need their own DSN
      # plumbing AND their own screenshot/view-hierarchy suppression, since
      # both render money. Worth doing; not worth bundling into the change
      # that establishes the privacy rules.
      - package: Sentry

  PaydayWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PaydayWidget
      - path: Payday/Models/TipEntry.swift
      - path: Payday/Models/PaycheckRecord.swift
      # The widget opens the same App Group store through
      # SharedModelContainer, so its schema list has to be satisfiable in
      # this process too. Miss this and ModelContainer(for:) throws in the
      # widget, openingFailed is set, and the Lock Screen renders
      # "Couldn't load" while the app is perfectly healthy.
      - path: Payday/Models/ShiftRecord.swift
      # The widget compiles ShiftDetails and TipBreakdown, and S9 makes both
      # generic over LegacyShiftRow, so the protocol has to be in this target
      # too or those two files no longer compile here. ShiftProjection comes
      # with it because the widget reads shifts through the same projection
      # the app does -- two surfaces resolving a shift differently is the
      # whole class of bug this PR exists to remove.
      - path: Payday/Models/LegacyShiftRow.swift
      - path: Payday/Models/ShiftProjection.swift
      # The widget must consult the SAME shiftsAreAuthoritative the app does,
      # or the Lock Screen renders pre-conversion numbers while the app shows
      # post-conversion ones. design-lint pins that accessor to one
      # definition, so the honest way to reach it here is to compile the file
      # rather than grow a second copy on a standalone AppGroup key --
      # AppGroup.swift IS already in this target, so such a copy would compile
      # and no test would cover the divergence.
      - path: Payday/Sync/PaydaySyncState.swift
      # PaydaySyncState parses checkpoint timestamps with PaydayRemoteDate.
      - path: Payday/Sync/PaydayRemoteDate.swift
      - path: Payday/Models/PayScheduleStore.swift
      # The widget values shifts too, so it reads the same compensation
      # policies — and therefore the same frozen payroll time zone — the app
      # does, out of the shared App Group defaults.
      - path: Payday/Models/PolicyStore.swift
      # The widget recomputes its own snapshot rather than reading a file
      # the app wrote (Design 2, "Out-of-process: recompute, do not read a
      # file"), so it compiles the adapter and EarningsStore.buildOnce. Both
      # are extension-safe: neither touches UIApplication.
      - path: Payday/Earnings/ShiftInputAdapter.swift
      - path: Payday/Earnings/EarningsStore.swift
      # The ONE path the widget and Siri both take to a pay-period figure.
      # Compiled into this target precisely so the widget cannot drift onto a
      # copy: there is one implementation of which query, which asOf and which
      # label, and both surfaces call it.
      - path: Payday/Earnings/AmbientPeriodFigure.swift
      - path: Payday/Utilities/PayPeriod.swift
      - path: Payday/Utilities/TipBreakdown.swift
      - path: Payday/Utilities/StatsEngine.swift
      # StatsEngine's Move copy spells its counts through this — the widget
      # compiles StatsEngine, so it needs it too or the build fails with
      # "cannot find 'NumberWords' in scope".
      - path: Payday/Utilities/NumberWords.swift
      - path: Payday/Utilities/WageEstimate.swift
      # WageEstimate and PeriodIncome are thin wrappers over
      # CompensationLedger as of PR 3, and the bridge is how they reach it.
      - path: Payday/Utilities/LegacyLedgerBridge.swift
      - path: Payday/Utilities/ShiftDays.swift
      - path: Payday/Utilities/ShiftDetails.swift
      - path: Payday/Utilities/ShiftReceiptMetrics.swift
      - path: Payday/Utilities/PeriodIncome.swift
      - path: Payday/Utilities/AppGroup.swift
      # The widget renders in its own process and never traverses RootView,
      # so it has to consult the shared authorization policy itself before
      # putting earnings on a Lock Screen.
      - path: Payday/Sync/PaydayAuthorizationState.swift
      - path: Payday/Utilities/SharedModelContainer.swift
      - path: Payday/Utilities/DeepLinkCoordinator.swift
      - path: Payday/Design/DesignSystem.swift
      - path: Payday/Views/Shared/TipEntrySheetTarget.swift
      - path: Payday/Intents/OpenLogSheetIntent.swift
      - path: Payday/Utilities/ShiftSessionStore.swift
      - path: Payday/Utilities/ShiftSessionManager.swift
      - path: Payday/Intents/ShiftIntents.swift
      - path: Payday/PaydayCoreExports.swift
    settings:
      base:
        PRODUCT_NAME: PaydayWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday.widget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "9142029"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Payday
        CODE_SIGN_ENTITLEMENTS: PaydayWidget/PaydayWidget.entitlements
        # The widget shares Payday's local cache but never links the Supabase
        # client. The flag keeps extension-only compilation explicit.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
    dependencies:
      - package: PaydayCore
    info:
      path: Generated/PaydayWidget-Info.plist
      properties:
        CFBundleDisplayName: Payday
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  PaydayTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: PaydayTests
    dependencies:
      - target: Payday
      - package: PaydayCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.szakacsmedia.payday.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Payday:
    build:
      targets:
        Payday: all
        PaydayWidget: all
        PaydayTests: [test]
    test:
      config: Debug
      targets:
        - PaydayTests
    run:
      config: Debug
